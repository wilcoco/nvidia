name: PostgreSQL integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres-required:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: understudy_test
          POSTGRES_PASSWORD: understudy_test
          POSTGRES_DB: understudy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U understudy_test -d understudy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://understudy_test:understudy_test@127.0.0.1:5432/understudy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Required PostgreSQL variants
        run: npm run test:postgres
